<div [class]="styleContainer">
    <app-title [text]="titleTable" [style]="'titleTableAdmin'"></app-title>
    <div class="scroll-container">
      <div [class]="header">
        <app-title *ngFor="let title of titles" [text]="title.title" [style]="'titleTableAdmin'"></app-title>
      </div>

      <section class="conten-table">
        <div  *ngIf="items.length > 0">
          <div *ngFor="let item of items" [class]="conten">
            <app-text *ngIf="item.tipe" [text]="item.tipe | truncate:10:true" [style]="'textTableAdmin'"></app-text>
            <app-text [text]="item.name | truncate:10:true" [style]="'textTableAdmin'"></app-text>
            <app-text 
            [text]="item.location | truncate:truncateNumber:true" 
            [style]="'textTableAdmin'">
        </app-text>
         <app-text [text]="item.id | truncate:truncaIdteNumber:true" [style]="'textTableAdmin'"></app-text>
            <app-toggle-switch *ngIf="item.isToggled !== undefined"
              [(checked)]="item.isToggled"
              (checkedChange)="onToggleChange($event, item)">
            </app-toggle-switch>
            <div class="botons">
              <app-icon *ngIf="styleContainer !== 'contenTableAddPaquete'"
                src="assets/icons/lapiz.png" 
                alt="" 
                [style]="'iconHotelAdmin'" 
                (click)="openModalEdit(item)">
              </app-icon>

            <app-icon *ngIf="styleContainer === 'contenTableAddPaquete'"
                src="assets/icons/stage.png" 
                alt="" 
                [style]="'iconHotelAdmin'" 
                (click)="removed(item)">
              </app-icon>

              <app-icon 
                src="assets/icons/eye.png" 
                alt="" 
                [style]="'iconHotelAdmin'" 
                (click)="openModalView(item)">
              </app-icon>
            </div>
            
          </div>
        </div>
        <div class="undefoult" *ngIf="!isLoading && items.length == 0">
          <img src="assets/icons/techny-searching-for-a-file-in-a-folder.gif" alt="undefoult">
          <app-title [style]="'state-Tables'" text="Oh no!, no se ha econtrado ningun contenido"></app-title>
        </div>

        <div class="undefoult" *ngIf="isLoading">
          <img src="assets/icons/loadingData.gif" alt="undefoult">
          <app-title [style]="'state-Tables'" text="Cargando..."></app-title>
        </div>
      </section>
    </div>
  </div>
