<div class="input-text-container">
  <app-icon [src]="src" [alt]="alt" [style]="styleIcon"></app-icon>
  <app-input-text
    [control]="inputControl"
    [type]="type"
    [placeholder]="placeholder"
    (enterPressed)="onEnterPressed()"
    [isReadOnly]="isReadOnly"
    [style]="styleinput"
    [max]="12">
  </app-input-text>
</div>
