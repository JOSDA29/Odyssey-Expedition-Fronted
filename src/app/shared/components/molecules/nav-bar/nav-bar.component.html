<div class="nav-bar">
  <a href="/">
    <app-logo [src]="srclogo" [alt]="altlogo"></app-logo>
  </a>
  <div class="menu">
    <app-link
      *ngFor="let link of links; let i = index"
      [href]="link.href" 
      [style]="'info-normal'" 
      [text]="link.text"
      [isSelected]="selectedLinkIndex === i"
      (linkSelected)="selectLink(i)"
    ></app-link>
  </div>
  <app-icon [src]="userProfilePicture" [alt]="alticon" [style]="'profile'" (click)="openLoginModal()"></app-icon>
</div>
