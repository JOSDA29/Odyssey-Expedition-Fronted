<div [class]="style">
  <app-text [text]="title" [style]="'textHotelUpdate'"></app-text>
  <textarea
    [ngClass]="{ 'readonly': isReadOnly }"
    [attr.readonly]="isReadOnly ? true : null"
    [placeholder]="placeholder"
    [(ngModel)]="description"
    (ngModelChange)="onDescriptionChange($event)"
  ></textarea>
</div>
