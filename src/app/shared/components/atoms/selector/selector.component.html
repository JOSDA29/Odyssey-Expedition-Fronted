<div class="conten">
  <label [for]="selectId">
      <app-text [text]="textSelect" [style]="'chatIA'"></app-text>
  </label>
  <select 
    [id]="selectId" 
    [ngClass]="selectClass" 
    [disabled]="disabled" 
    [value]="selectedValue" 
    (change)="onSelectChange($event)">
      <option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </option>
  </select>
</div>
