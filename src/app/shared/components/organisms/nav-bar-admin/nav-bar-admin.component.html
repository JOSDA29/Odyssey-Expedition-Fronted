<div class="conten">
    <div class="title" *ngFor="let title of titles">
      <!-- Mostrar el primer título si title1 no está vacío -->
      <app-title *ngIf="title.title1 !== ''" 
                 [text]="title.title1" 
                 [ngClass]="{'with-line': title.title2 !== ''}" 
                 [style]="'title-nosotros-profile'" 
                 class="title1"></app-title>
      
      <!-- Mostrar el segundo título solo si tiene valor -->
      <app-title *ngIf="title.title2 !== ''" 
                 [text]="title.title2" 
                 [style]="'title-nosotros-profile'"></app-title>
    </div>
    <app-icon src="assets/icons/profile.png" alt="profile" [style]="'profile'"></app-icon>
  </div>
