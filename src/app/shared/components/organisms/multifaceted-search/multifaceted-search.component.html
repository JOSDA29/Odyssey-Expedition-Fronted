<div class="multifaceted-search">
  <div class="conten-top">
    <app-conten-top
    [style]="'image-top-home'"
    toptitle="!Bienvenido a Odyssey Expedition¡"
    topsubtitle="!Encuentra los mejores precios¡"
    ></app-conten-top>
    <app-images [src]="imgUrl"
    alt="image"
    ></app-images>
  </div>
  <div class="content">
    <app-share-button [contens]="contenButton" (selected)="onMenuSelected($event)"></app-share-button>
    <app-conten-multifaceted 
      *ngIf="nuberMenu === 0" 
      [contensSection]="contenSection" 
      [checkboxes]="checkContens" 
      textbutton="Buscar">
    </app-conten-multifaceted>
    <app-search-hotel *ngIf="nuberMenu === 1" [contenHotel]="contenHotel"></app-search-hotel>
    <app-search-paquetes *ngIf="nuberMenu === 2" [contenPaquete]="contenPaquete"></app-search-paquetes>
    <app-search-cruseros *ngIf="nuberMenu === 3" [contenCruseros]="contenCruseros"></app-search-cruseros>
  </div>
  
</div>
